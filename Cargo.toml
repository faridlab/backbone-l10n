[package]
name = "backbone-l10n"
version = "0.1.8"
edition = "2021"
description = "Indonesian localization datasets: SAK chart of accounts + starter tax templates"

[lib]
path = "src/lib.rs"

[dependencies]
# Chart dataset types + validation vocabulary only (AccountType/Subtype/NormalBalance).
# Dev builds against a local sibling checkout: copy .cargo/config.toml.example to
# .cargo/config.toml (gitignored). Without it, Cargo builds from this pin — the CI path.
# Keep this pin in lockstep with the accounting tag the consuming app pins —
# `id_sak_chart()` returns accounting's `ChartDataset`, so a pin drift splits
# the dependency graph into two accounting copies and type-errors at the
# composition site (the local workspace [patch] hides the split; CI exposes it).
backbone-accounting = { git = "https://github.com/faridlab/backbone-accounting", tag = "v0.6.10" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
